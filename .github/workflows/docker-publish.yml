name: Build and Push Docker Image

# Runs on a pushed v* tag or a manual dispatch with an explicit version.
# Pushing the branch itself does not trigger a build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, e.g. 1.2.3 or v1.2.3 (pre-release: 1.2.3-rc1)'
        required: true
        type: string
      update_latest:
        description: 'Also update the latest and major.minor tags (ignored for pre-releases)'
        required: false
        type: boolean
        default: false
      overwrite:
        description: 'Allow overwriting this version if it already exists on Docker Hub'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: 'docker-publish-${{ github.ref }}'
  cancel-in-progress: false

env:
  # Full Docker Hub image path; empty derives username/repository.
  IMAGE_NAME: ''

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      floating: ${{ steps.version.outputs.floating }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$INPUT_VERSION"
          else
            raw="$REF_NAME"
          fi
          version="${raw#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$raw' (expected e.g. 1.2.3 or v1.2.3-rc1)" >&2
            exit 1
          fi

          major_minor="$(cut -d. -f1-2 <<< "$version")"

          # Pre-releases never move latest / major.minor
          floating=false
          if [[ "$version" != *-* ]]; then
            if [[ "$EVENT_NAME" == "push" || "$INPUT_UPDATE_LATEST" == "true" ]]; then
              floating=true
            fi
          fi

          {
            echo "version=$version"
            echo "major_minor=$major_minor"
            echo "floating=$floating"
          } >> "$GITHUB_OUTPUT"
          echo "Building version=$version floating=$floating"

      - name: Resolve image name
        env:
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY##*/}"
          repository_name="${repository_name,,}"
          image_name="$IMAGE_NAME"
          if [[ -z "$image_name" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" ]]; then
              echo "::error::DOCKERHUB_USERNAME is required when IMAGE_NAME is not set" >&2
              exit 1
            fi
            image_name="${DOCKERHUB_USERNAME}/${repository_name}"
          fi
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Refuse to overwrite an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" > /dev/null 2>&1; then
            if [[ "$OVERWRITE" == "true" ]]; then
              echo "::warning::${IMAGE_NAME}:${VERSION} already exists and will be overwritten"
            else
              echo "::error::${IMAGE_NAME}:${VERSION} already exists. Re-run manually with 'overwrite' to replace it." >&2
              exit 1
            fi
          fi

  build:
    name: 'Build ${{ matrix.arch }}'
    needs: prepare
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve image name
        id: names
        env:
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY##*/}"
          repository_name="${repository_name,,}"
          image_name="$IMAGE_NAME"
          if [[ -z "$image_name" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" ]]; then
              echo "::error::DOCKERHUB_USERNAME is required when IMAGE_NAME is not set" >&2
              exit 1
            fi
            image_name="${DOCKERHUB_USERNAME}/${repository_name}"
          fi
          printf 'repository_name=%s\n' "$repository_name" >> "$GITHUB_OUTPUT"
          printf 'image_name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: 'linux/${{ matrix.arch }}'
          outputs: 'type=image,name=${{ steps.names.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true'
          provenance: false
          sbom: false
          cache-from: 'type=gha,scope=${{ steps.names.outputs.repository_name }}-${{ matrix.arch }}'
          cache-to: 'type=gha,mode=max,scope=${{ steps.names.outputs.repository_name }}-${{ matrix.arch }}'

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: 'digests-${{ matrix.arch }}'
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Arch Manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Recomputed here: job outputs containing a secret are dropped by the runner.
      - name: Resolve image name
        env:
          DOCKERHUB_USERNAME: '${{ secrets.DOCKERHUB_USERNAME }}'
        run: |
          set -euo pipefail
          repository_name="${GITHUB_REPOSITORY##*/}"
          repository_name="${repository_name,,}"
          image_name="$IMAGE_NAME"
          if [[ -z "$image_name" ]]; then
            if [[ -z "$DOCKERHUB_USERNAME" || -z "$repository_name" ]]; then
              echo "::error::DOCKERHUB_USERNAME and repository name are required when IMAGE_NAME is not set" >&2
              exit 1
            fi
            image_name="${DOCKERHUB_USERNAME}/${repository_name}"
          fi
          printf 'IMAGE_NAME=%s\n' "$image_name" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: 'digests-*'
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Docker meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.IMAGE_NAME }}'
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.floating == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.floating == 'true' }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE_NAME:-}" ]]; then
            echo "::error::IMAGE_NAME is empty; refusing to create manifest" >&2
            exit 1
          fi
          if [[ -z "${DOCKER_METADATA_OUTPUT_JSON:-}" ]]; then
            echo "::error::metadata output is missing; refusing to create manifest" >&2
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "${tag}")
          done
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "::error::metadata-action produced no tags" >&2
            exit 1
          fi
          source_args=()
          shopt -s nullglob
          for digest in *; do
            source_args+=("${IMAGE_NAME}@sha256:${digest}")
          done
          if [[ ${#source_args[@]} -eq 0 ]]; then
            echo "::error::no digest artifacts found in $(pwd)" >&2
            exit 1
          fi
          printf 'tags: %s\n' "${tag_args[*]}"
          printf 'sources: %s\n' "${source_args[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

      - name: Verify
        run: |
          set -euo pipefail
          if [[ -z "${DOCKER_METADATA_OUTPUT_JSON:-}" ]]; then
            echo "::error::metadata output is missing; cannot verify" >&2
            exit 1
          fi
          tag_count="$(jq '.tags | length' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          if [[ "${tag_count}" -eq 0 ]]; then
            echo "::error::metadata-action produced no tags; cannot verify" >&2
            exit 1
          fi
          printf 'verifying %s tags\n' "${tag_count}"
          while IFS= read -r tag; do
            docker buildx imagetools inspect "${tag}"
            docker buildx imagetools inspect --raw "${tag}" |
              jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' > /dev/null
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
