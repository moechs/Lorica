name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: 'docker-publish-${{ github.ref }}'
  cancel-in-progress: false

env:
  IMAGE_NAME: '${{ secrets.DOCKERHUB_USERNAME }}/lorica'

jobs:
  build:
    name: 'Build ${{ matrix.arch }}'
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: 'linux/${{ matrix.arch }}'
          outputs: 'type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true'
          provenance: false
          sbom: false
          cache-from: 'type=gha,scope=lorica-${{ matrix.arch }}'
          cache-to: 'type=gha,mode=max,scope=lorica-${{ matrix.arch }}'

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: 'digests-${{ matrix.arch }}'
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: 'digests-*'
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_TOKEN }}'

      - name: Docker meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.IMAGE_NAME }}'
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Verify
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "${tag}"
            docker buildx imagetools inspect --raw "${tag}" |
              jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' > /dev/null
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
